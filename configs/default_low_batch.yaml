wandb_project: scpt-rl
wandb_run_name: null

env:
  board_paths:
    - dataset/base_raw/bistable_oscillator_with_555_timer_and_ldo_2lyr_setup_00.kicad_pcb
    - dataset/base_raw/PModBoard.kicad_pcb
    - dataset/base_raw/tc_logger_mcu.kicad_pcb
    - dataset/base_raw/ATMEGA328_Motor_Board.kicad_pcb
    - dataset/base_raw/Blixten.kicad_pcb
    - dataset/base_raw/voltage_datalogger_adc0.kicad_pcb

  grid_resolution_mm: 0.5
  min_spacing_mm: 0.2
  expert_cut_cost: 1.0
  infeasible_penalty: 100.0

model:
  d: 256
  pair_dim: 14
  n_heads: 8
  n_layers: 4

bc:
  board_paths:
    - dataset/base_raw/bistable_oscillator_with_555_timer_and_ldo_2lyr_setup_00.kicad_pcb
    - dataset/base_raw/PModBoard.kicad_pcb
    - dataset/base_raw/tc_logger_mcu.kicad_pcb
    - dataset/base_raw/voltage_datalogger_adc0.kicad_pcb

  epochs: 20
  lr: 3.0e-4

ppo:
  n_outer_iters: 1000
  n_steps_per_iter: 128

  clip_eps: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  lr: 3.0e-4
  epochs: 4
  minibatch_size: 32  # Reduced from 64 to 32

  sigma: 1.0

  constraint_names:
    - c_hpwl
    - c_clearance
    - c_partition

  constraint_budgets:
    c_hpwl: 500.0
    c_clearance: 0.0
    c_partition: 1.15

  dual_alpha: 0.01
  dual_ema_decay: 0.9

  checkpoint_interval: 100
  log_interval: 10