# SCPT-RL configuration with reduced mini-batch size
# This reduces GPU memory usage during PPO update by decreasing the mini-batch size

wandb_project: scpt-rl
wandb_run_name: null

env:
  board_paths:
    - dataset/base_raw/bistable_oscillator_with_555_timer_and_ldo_2lyr_setup_00.kicad_pcb
    - dataset/base_raw/PModBoard.kicad_pcb
    - dataset/base_raw/tc_logger_mcu.kicad_pcb
    - dataset/base_raw/ATGE328_Motor_Board.kicad_pcb
    - dataset/base_raw/Blixten.kicad_pcb
    - dataset/base_raw/voltage_datalogger_adc0.kicad_pcb

  grid_resolution_mm: 0.5     # grid cell size in mm
  min_spacing_mm: 0.2         # DRC clearance threshold for the cost function
  expert_cut_cost: 1.0        # baseline partition-cut cost (b_partition = 1.15×)
  infeasible_penalty: 100.0   # penalty added when no legal cell remains

model:
  d: 256                      # hidden dimension (policy + value heads)
  pair_dim: 14                # live-pair feature dimension per placed component
  n_heads: 8                  # number of cross-attention heads
  n_layers: 4                 # number of cross-attention layers

bc:
  board_paths:
    - dataset/base_raw/bistable_oscillator_with_555_timer_and_ldo_2lyr_setup_00.kicad_pcb
    - dataset/base_raw/PModBoard.kicad_pcb
    - dataset/base_raw/tc_logger_mcu.kicad_pcb
    - dataset/base_raw/voltage_datalogger_adc0.kicad_pcb

  epochs: 20                  # passes over the full BC dataset
  lr: 3.0e-4                  # Adam learning rate for BC

ppo:
  n_outer_iters: 1000         # number of (collect → update) outer iterations
  n_steps_per_iter: 128       # environment steps collected per outer iter

  # PPO core
  clip_eps: 0.2               # PPO clipping epsilon
  gamma: 0.99                 # discount factor
  gae_lambda: 0.95            # GAE lambda
  lr: 3.0e-4                  # Adam learning rate for PPO update
  epochs: 4                   # PPO epochs per outer iteration
  minibatch_size: 16          # Reduced from 64 to 16

  # Augmented Lagrangian
  sigma: 1.0                  # AL quadratic penalty coefficient

  # Constraints — extend this list to add new constraint heads.
  constraint_names:
    - c_hpwl
    - c_clearance
    - c_partition

  constraint_budgets:
    c_hpwl: 500.0             # allowed HPWL cost per episode (mm · net-count)
    c_clearance: 0.0          # clearance cost budget (0 = no violation allowed)
    c_partition: 1.15         # ≤ 1.15× the expert partition-cut cost

  # Dual ascent
  dual_alpha: 0.01            # λ ascent step size
  dual_ema_decay: 0.9         # EMA smoothing for φ_c before dual update

  # Checkpointing + logging
  checkpoint_interval: 100    # save checkpoint every N outer iters
  log_interval: 10            # log to stdout every N outer iters