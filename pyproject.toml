[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scpt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "wandb>=0.15",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
