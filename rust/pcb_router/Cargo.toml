[package]
name = "pcb_router"
version = "0.1.0"
edition = "2021"
description = "Grid-based PCB router (ported from PcbRouter/pcb_router_rs) exposed as a PyO3 wheel."

[lib]
name = "pcb_router"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Binary target is intentionally disabled — we ship only the library for PyO3.
# [[bin]]
# name = "pcb_router"
# path = "src/main.rs"

[dependencies]
kiutils-rs = "0.2.0"
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests use std-only; no extra dev deps needed for the port.
