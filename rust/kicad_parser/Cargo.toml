[package]
name = "kicad_parser"
version = "0.1.0"
edition = "2021"
description = "KiCad .kicad_pcb and .kicad_sch parser (library only; binary lives in the upstream standalone crate)"

[lib]
name = "kicad_parser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
geo-types = "0.7"
geo = "0.28"
regex = "1.10"
